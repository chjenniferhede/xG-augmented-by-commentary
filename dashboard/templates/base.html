<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if running %}<meta http-equiv="refresh" content="5">{% endif %}
  <title>xG pipeline</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d2129; --muted: #626a75; --line: #dfe2e6; --card: #ffffff;
            --accent: #2457b5; --ok: #1d7a46; --warn: #a15c00; --bad: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15181d; --fg: #e6e8eb; --muted: #9aa3ad; --line: #2c3139; --card: #1c2027;
              --accent: #7aa7ff; --ok: #5cc98a; --warn: #e3a24a; --bad: #ff8a80; }
    }
    body { background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, system-ui, sans-serif;
           margin: 0; padding: 24px 16px 64px; }
    main { max-width: 1280px; margin: 0 auto; }
    nav a { margin-right: 16px; color: var(--accent); text-decoration: none; font-weight: 600; }
    h1 { font-size: 22px; margin: 16px 0 8px; } h2 { font-size: 17px; margin: 28px 0 8px; }
    table { border-collapse: collapse; width: 100%; background: var(--card); }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 13px; }
    .wrap { overflow-x: auto; }
    .muted { color: var(--muted); } .ok { color: var(--ok); } .partial, .skipped { color: var(--warn); }
    .failed, .blocked { color: var(--bad); } .running { color: var(--accent); }
    .banner { padding: 10px 14px; border-radius: 6px; margin: 12px 0; border: 1px solid var(--line); background: var(--card); }
    .banner.bad { border-color: var(--bad); } .banner.info { border-color: var(--accent); }
    .cards { display: flex; flex-wrap: wrap; gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 120px; }
    .card b { display: block; font-size: 22px; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent);
             background: var(--accent); color: #fff; cursor: pointer; margin-right: 8px; }
    button.secondary { background: transparent; color: var(--accent); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    pre { background: var(--card); border: 1px solid var(--line); padding: 10px; overflow-x: auto;
          font-size: 12.5px; max-height: 520px; }
    code { font-size: 13px; }
    a { color: var(--accent); }
    /* video browser */
    .browser { display: grid; grid-template-columns: 210px 1fr; gap: 20px; margin-top: 12px; }
    @media (max-width: 760px) { .browser { grid-template-columns: 1fr; } }
    .folders { display: flex; flex-direction: column; gap: 2px; }
    .folders a { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 6px;
                 color: var(--fg); text-decoration: none; margin: 0; font-weight: normal; border: 1px solid transparent; }
    .folders a:hover { background: var(--card); }
    .folders a.on { background: var(--card); border: 1px solid var(--line); font-weight: 600; }
    .folders .n { color: var(--muted); font-variant-numeric: tabular-nums; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .toolbar input[type=search] { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
                                  background: var(--card); color: var(--fg); min-width: 220px; flex: 1; }
    .toolbar button { margin-right: 0; }
    .tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line);
           white-space: nowrap; }
    .tag.aligned { color: var(--ok); border-color: var(--ok); }
    .tag.alignment_unverified, .tag.game_unresolved, .tag.no_captions, .tag.no_game_data { color: var(--warn); border-color: var(--warn); }
    .files span { margin-right: 8px; white-space: nowrap; }
    .files .no { color: var(--muted); opacity: .6; }
    tr.pick td { cursor: pointer; } tr.pick:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
    td.check { width: 28px; }
    dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
    dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; }
    form.inline { display: inline-flex; gap: 8px; align-items: center; }
    form.inline input { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
                        background: var(--card); color: var(--fg); width: 140px; }
  </style>
</head>
<body><main>
  <nav><a href="{{ url_for('index') }}">Overview</a><a href="{{ url_for('videos') }}">Videos</a></nav>
  {% for message in get_flashed_messages() %}<div class="banner info">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main></body>
</html>
